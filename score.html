<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪评分 · A股人气雷达</title>
    <link rel="stylesheet" href="styles.css?v=20261025b">
    <script src="echarts.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js';document.head.appendChild(s);"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e74c3c'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>股</text></svg>">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-text">
                <h1>📈 A股人气雷达</h1>
                <p class="subtitle">情绪评分 · 独立页面</p>
                <p class="score-page-back"><a class="mini-btn" href="/">← 返回主站</a></p>
            </div>
            <div class="market-score" id="market-score-box" title="情绪评分 = 五因子加权（0–100），只反映当日市场情绪，不构成买卖建议">
                <div class="ms-label">今日情绪评分</div>
                <div class="ms-value"><span id="hs-score">--</span><span class="ms-unit">分</span></div>
                <div class="ms-sub"><span class="ms-tag ms-live hidden" id="hs-live">盘中</span><span class="ms-tag" id="hs-label">—</span><span id="hs-date">—</span></div>
            </div>
        </header>

        <section id="panel-score" class="panel">

            <div class="screen-intro sc-intro">
                <div class="sc-head">
                    <h2>🧮 情绪评分 · 历史回测</h2>
                    <div class="sc-head-actions">
                        <button class="mini-btn live-btn" id="sc-intraday-btn" onclick="scoreIntraday()"
                                title="盘中抓一次全市场实时行情（约 5~12 秒），按此刻数据估算今日情绪评分（不写库）">⚡ 盘中估算</button>
                        <button class="mini-btn" id="sc-rebuild-btn" onclick="scoreRebuild()">↻ 重算评分</button>
                        <button class="mini-btn" onclick="scoreExportCsv()" title="导出历史评分 + 回测汇总（CSV，Excel 可直接打开）">⬇ 导出 CSV</button>
                    </div>
                </div>
                <p class="screen-desc">
                    0–100 分由五个因子加权：<b>市场广度 30</b> + <b>涨停跌停 25</b> + <b>炸板质量 15</b> + <b>人气股表现 15</b> + <b>指数与成交确认 15</b>。
                    数据缺失时<b>不补零</b>，只按可用因子重新归一，并标注「降级评分」和缺失原因。
                    今日总分与标签同步显示在页面右上角。
                    回测只做统计研究，<b>不构成任何买卖建议，也不承诺收益</b>。
                </p>
            </div>

            <!-- 首屏：今日总分 + 五因子 -->
            <div class="sc-hero sc-hero--factors">
                <div class="sc-hero-meta">
                    <span>交易日 <b id="sc-date">—</b></span>
                    <span id="sc-comp">完整度 —</span>
                </div>
                <div class="sc-factors" id="sc-factors">
                    <div class="sc-empty">加载中…</div>
                </div>
            </div>
            <div id="sc-alerts" class="sc-alerts hidden"></div>

            <!-- 历史评分曲线 -->
            <div class="hot-themes-box">
                <div class="hot-themes-head">
                    <h3>📈 历史评分曲线</h3>
                    <div class="sc-chips" id="sc-range-chips">
                        <button class="mini-btn active" data-r="1m" onclick="scoreRange('1m')">近1月</button>
                        <button class="mini-btn" data-r="3m" onclick="scoreRange('3m')">近3月</button>
                        <button class="mini-btn" data-r="1y" onclick="scoreRange('1y')">近1年</button>
                        <button class="mini-btn" data-r="3y" onclick="scoreRange('3y')">近3年</button>
                        <button class="mini-btn" data-r="all" onclick="scoreRange('all')">全部</button>
                    </div>
                </div>
                <div class="sc-legend" id="sc-legend"></div>
                <div id="sc-chart" class="sc-chart"></div>
                <div class="sc-hint" id="sc-chart-hint"></div>
            </div>

            <!-- 回测 -->
            <div class="hot-themes-box">
                <div class="hot-themes-head">
                    <h3>🧪 历史回测 · 未来 1 / 3 / 5 日</h3>
                    <div class="sc-bt-controls">
                        <select id="sc-index" class="mh-year" onchange="loadScoreBacktest(true)" title="选择基准指数">
                            <option value="000300">沪深300</option>
                            <option value="000001">上证指数</option>
                            <option value="000688">科创50</option>
                            <option value="399006">创业板指</option>
                            <option value="000852">中证1000</option>
                        </select>
                        <select id="sc-bt-range" class="mh-year" onchange="loadScoreBacktest(true)" title="回测样本范围">
                            <option value="all">全部历史</option>
                            <option value="3y">近3年</option>
                            <option value="1y">近1年</option>
                        </select>
                        <button class="mini-btn" onclick="loadScoreBacktest(true)">↻ 重新回测</button>
                    </div>
                </div>
                <div id="sc-bt-body">
                    <div class="sc-empty">加载中…</div>
                </div>
            </div>

            <!-- 数据质量 -->
            <div class="hot-themes-box">
                <div class="hot-themes-head">
                    <h3>🧭 数据质量（最近 30 个交易日）</h3>
                    <button class="mini-btn" onclick="loadScoreQuality()">↻ 刷新</button>
                </div>
                <div id="sc-quality"><div class="sc-empty">加载中…</div></div>
            </div>
        
        </section>
    </div>

    <script src="score_module.js?v=20261025b"></script>
    <script src="score_page.js?v=20261025b"></script>
</body>
</html>
